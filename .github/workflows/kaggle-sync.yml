name: Auto-Sync Kaggle Leaderboard

on:
  repository_dispatch:
    types: [kaggle_run_complete]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper
        run: python sync_kaggle.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark-results/ telemetry_calendar.json
          git commit -m "data: auto-sync kaggle benchmark results" || echo "No changes to commit"
          git push